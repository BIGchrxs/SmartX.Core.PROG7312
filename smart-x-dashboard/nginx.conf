server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard calls /api/... and the API's own routes carry no prefix. The trailing slash
    # on proxy_pass strips the prefix back off, which is exactly what the Vite dev proxy does.
    # Because the browser only ever talks to this one origin, no CORS headers are needed.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single page application: any path that is not a real file still returns index.html,
    # so the router handles it rather than nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever their content does, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
